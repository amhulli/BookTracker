<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Books Read</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Books Read">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181e" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href='data:application/manifest+json,{"name":"Books Read","short_name":"Books Read","display":"standalone","start_url":".","background_color":"#eef1f4","theme_color":"#eef1f4"}'>
<link rel="apple-touch-icon" id="icon" href="">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#66707d; --line:#d9dfe5;
  --stamp:#8c2f39; --stamp-ink:#ffffff; --chip:#e2e8ee;
  --serif:ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --surface:#1d232b; --ink:#eef1f4; --muted:#97a1ad; --line:#2d3540;
    --stamp:#c8505c; --stamp-ink:#14181e; --chip:#2a323c; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{
  min-height:100vh;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 24px) env(safe-area-inset-left,0px);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
header{padding:22px 0 12px}
h1{font:700 34px/1.1 var(--serif);margin:0 0 16px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;background:var(--chip);padding:5px;border-radius:14px}
.tab{flex:1;min-height:48px;border:0;border-radius:10px;background:transparent;color:var(--muted);
  font:600 17px var(--sans);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tab:focus-visible,button:focus-visible,input:focus-visible,.row:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
form.search{display:flex;gap:10px;margin:18px 0 6px}
input[type=search]{
  flex:1;min-height:56px;font:400 19px var(--sans);color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;padding:0 16px;-webkit-appearance:none;appearance:none}
.btn{min-height:56px;padding:0 24px;border:0;border-radius:14px;background:var(--stamp);color:var(--stamp-ink);
  font:600 18px var(--sans);cursor:pointer}
.btn.quiet{background:var(--chip);color:var(--ink);min-height:48px;font-size:16px;padding:0 18px}
.btn:active{opacity:.8}
.filter{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;margin-top:6px}
.filter select{min-height:48px;font:500 16px var(--sans);color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.authors{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:48px;padding:6px 16px;border-radius:24px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:500 16px var(--sans);text-align:left;cursor:pointer}
.chip small{display:block;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.status{color:var(--muted);font-size:16px;padding:14px 2px;min-height:24px}
.status.error{color:var(--stamp)}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 8px;color:var(--muted);font-size:15px}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;
  -webkit-user-select:none;user-select:none}
.row:first-child{border-top:0}
.row:active{background:var(--chip)}
.box{flex:none;width:40px;height:40px;border-radius:11px;border:2.5px solid var(--muted);display:grid;place-items:center;
  transition:background .12s,border-color .12s}
.box svg{width:24px;height:24px;stroke:var(--stamp-ink);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
.row[aria-checked="true"] .box{background:var(--stamp);border-color:var(--stamp)}
.row[aria-checked="true"] .box svg{opacity:1;transform:none}
.t{flex:1;min-width:0}
.t b{display:block;font:600 20px/1.25 var(--serif);overflow-wrap:anywhere}
.t span{color:var(--muted);font-size:15px}
.sub{display:flex;justify-content:space-between;align-items:baseline;font:700 19px/1.2 var(--serif);margin:20px 2px 8px}
.sub span{font:500 14px var(--sans);color:var(--muted)}
.row.sel{background:var(--chip);box-shadow:inset 6px 0 0 var(--stamp)}
.acts{display:flex;align-items:center;gap:14px}
#sbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 12px)}
#sbar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#sbar input{flex:1;min-width:180px;min-height:52px;font:400 18px var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
#sbar .btn{min-height:52px;padding:0 18px;font-size:17px}
body.org{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
.group{margin:22px 0 0}
.group h2{display:flex;justify-content:space-between;align-items:baseline;font:700 24px/1.2 var(--serif);margin:0 2px 10px}
.group h2 span{font:500 15px var(--sans);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:18px;line-height:1.5}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line);align-items:center}
.tools p{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Books Read</h1>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-search" role="tab" aria-selected="true" aria-controls="view-search">Find books</button>
      <button class="tab" id="tab-lib" role="tab" aria-selected="false" aria-controls="view-lib">My library (<span id="count">0</span>)</button>
    </div>
  </header>

  <main>
    <section id="view-search" role="tabpanel" aria-labelledby="tab-search">
      <form class="search" id="form">
        <input type="search" id="q" placeholder="Author name, e.g. Ursula K. Le Guin" autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="search" aria-label="Author name">
        <button class="btn" type="submit">Search</button>
      </form>
      <label class="filter">Language
        <select id="lang" aria-label="Language filter">
          <option value="eng">English</option>
          <option value="spa">Spanish</option>
          <option value="fre">French</option>
          <option value="ger">German</option>
          <option value="ita">Italian</option>
          <option value="">All languages</option>
        </select>
      </label>
      <div class="authors" id="authors" aria-label="Matching authors"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div id="results"></div>
    </section>

    <section id="view-lib" role="tabpanel" aria-labelledby="tab-lib" hidden>
      <div id="library"></div>
      <div class="tools">
        <button class="btn quiet" id="export" type="button">Export backup</button>
        <button class="btn quiet" id="import" type="button">Import backup</button>
        <input type="file" id="file" accept="application/json,.json" hidden>
        <p>Your list lives only on this iPad. Export a backup now and then, and save it to Files or iCloud Drive.</p>
        <p id="msg" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <div id="sbar" hidden>
    <div class="in">
      <span id="selcount" style="color:var(--muted);font-size:15px">0 selected</span>
      <input id="sname" list="serieslist" placeholder="Series name" autocomplete="off" autocapitalize="words" aria-label="Series name">
      <datalist id="serieslist"></datalist>
      <button class="btn" id="assign" type="button">Add to series</button>
      <button class="btn quiet" id="unassign" type="button">Remove from series</button>
      <button class="btn quiet" id="sdone" type="button">Done</button>
      <span id="smsg" style="flex-basis:100%;color:var(--stamp);font-size:14px"></span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY="booksRead.v1", API="https://openlibrary.org";
  var $=function(id){return document.getElementById(id)};

  /* ---------- storage ---------- */
  function load(){
    try{var r=JSON.parse(localStorage.getItem(KEY)||"{}");return r&&typeof r==="object"?r:{}}catch(e){return {}}
  }
  var lib=load();
  var SKEY="booksRead.series.v1";
  function loadSeries(){try{var r=JSON.parse(localStorage.getItem(SKEY)||"{}");return r&&typeof r==="object"&&!Array.isArray(r)?r:{}}catch(e){return {}}}
  var series=loadSeries();
  function saveSeries(){try{localStorage.setItem(SKEY,JSON.stringify(series))}catch(e){flash("Could not save series.",true)}}
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(lib))}catch(e){flash("Could not save: storage is full or blocked.",true)}
  }
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}

  /* ---------- helpers ---------- */
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function norm(t){
    return String(t).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
      .replace(/&/g," and ").replace(/[^a-z0-9 ]+/g," ").replace(/^(the|a|an) /,"").replace(/\s+/g," ").trim();
  }
  function lastName(n){var p=n.trim().split(/\s+/);return (p[p.length-1]||n).toLowerCase()}
  function flash(m,err){var el=$("msg");el.textContent=m;el.style.color=err?"var(--stamp)":"";}
  var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  /* ---------- tabs ---------- */
  function show(which){
    var s=which==="search";
    $("view-search").hidden=!s; $("view-lib").hidden=s;
    $("tab-search").setAttribute("aria-selected",s); $("tab-lib").setAttribute("aria-selected",!s);
    if(!s){if(organizing){organizing=false;sel={};renderResults();}updateBar();renderLib();}
    window.scrollTo(0,0);
  }
  $("tab-search").onclick=function(){show("search")};
  $("tab-lib").onclick=function(){show("lib")};

  /* ---------- search ---------- */
  var current={author:null,books:[]};
  var sel={},organizing=false;
  var LANGKEY="booksRead.lang";
  try{var sl=localStorage.getItem(LANGKEY);if(sl!==null)$("lang").value=sl}catch(e){}
  $("lang").addEventListener("change",function(){
    try{localStorage.setItem(LANGKEY,this.value)}catch(e){}
    if(current.author)pickAuthor(current.author);
  });
  function getJSON(url,tries){
    tries=tries||3;
    var ctl=("AbortController" in window)?new AbortController():null;
    var timer=setTimeout(function(){ctl&&ctl.abort()},15000);
    return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){
      clearTimeout(timer);
      if(!r.ok)throw new Error("Open Library returned "+r.status);
      return r.json();
    }).catch(function(err){
      clearTimeout(timer);
      if(tries>1)return new Promise(function(res){setTimeout(res,900)}).then(function(){return getJSON(url,tries-1)});
      if(location.protocol==="file:")throw new Error("this page is open as a local file; host it on an https site first");
      throw new Error(err&&err.name==="AbortError"?"Open Library took too long to respond":"could not reach Open Library");
    });
  }
  function findAuthors(q){
    return getJSON(API+"/search/authors.json?limit=6&q="+encodeURIComponent(q)).then(function(d){
      return (d.docs||[]).filter(function(a){return a.key&&a.name});
    }).catch(function(){
      /* fallback: derive authors from a book search */
      return getJSON(API+"/search.json?author="+encodeURIComponent(q)+"&fields=author_key,author_name&limit=60").then(function(d){
        var seen={},out=[];
        (d.docs||[]).forEach(function(w){
          (w.author_key||[]).forEach(function(k,i){
            var n=(w.author_name||[])[i]; if(!k||!n||seen[k])return;
            seen[k]=1; out.push({key:"/authors/"+k,name:n});
          });
        });
        return out.slice(0,6);
      });
    });
  }
  function setStatus(m,err){var s=$("status");s.textContent=m||"";s.className="status"+(err?" error":"")}

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var q=$("q").value.trim(); if(!q)return;
    $("q").blur();
    $("authors").innerHTML=""; $("results").innerHTML="";
    setStatus("Searching…");
    findAuthors(q).then(function(docs){
      if(!docs.length){setStatus("No author found for “"+q+"”. Check the spelling or try the last name only.",true);return}
      renderAuthors(docs); pickAuthor(docs[0]);
    }).catch(function(err){setStatus("Search failed: "+err.message+". Check your connection and try again.",true)});
  });

  function renderAuthors(docs){
    var box=$("authors"); box.innerHTML="";
    if(docs.length<2)return;
    docs.forEach(function(a,i){
      var b=document.createElement("button");
      b.type="button"; b.className="chip"; b.setAttribute("aria-pressed",i===0);
      b.innerHTML=esc(a.name)+"<small>"+(a.top_work?esc(a.top_work):"")+(a.work_count?" · "+a.work_count+" works":"")+"</small>";
      b.onclick=function(){
        Array.prototype.forEach.call(box.children,function(c){c.setAttribute("aria-pressed","false")});
        b.setAttribute("aria-pressed","true"); pickAuthor(a);
      };
      box.appendChild(b);
    });
  }

  function pickAuthor(a){
    var id=a.key.replace("/authors/","");
    organizing=false; sel={}; updateBar();
    setStatus("Loading books by "+a.name+"…"); $("results").innerHTML="";
    var url=API+"/search.json?author_key="+encodeURIComponent(id)+"&fields=key,title,first_publish_year&sort=old&limit=400"+
      ($("lang").value?"&language="+encodeURIComponent($("lang").value):"");
    getJSON(url).then(function(d){
      var seen={}, books=[];
      (d.docs||[]).forEach(function(w){
        if(!w.title)return;
        var n=norm(w.title); if(!n||seen[n])return;
        seen[n]=1;
        books.push({id:id+"|"+n,title:w.title,year:w.first_publish_year||null,author:a.name,authorKey:id});
      });
      books.sort(function(x,y){return (x.year||9999)-(y.year||9999)||x.title.localeCompare(y.title)});
      current={author:a,books:books};
      setStatus(books.length?"":"No books found for this author.",!books.length);
      renderResults();
    }).catch(function(err){setStatus("Could not load books: "+err.message+".",true)});
  }

  function rowHTML(b,checked){
    return '<li class="row'+(sel[b.id]?' sel':'')+'" role="checkbox" tabindex="0" aria-checked="'+checked+'" data-id="'+esc(b.id)+'">'+
      '<span class="box">'+CHECK+'</span>'+
      '<span class="t"><b>'+esc(b.title)+'</b><span>'+(b.year?b.year:"Year unknown")+'</span></span></li>';
  }

  function minYear(l){return Math.min.apply(null,l.map(function(b){return b.year||9999}))}
  function groupedHTML(books,isRead){
    var g={},none=[];
    books.forEach(function(b){var n=series[b.id];if(n){(g[n]=g[n]||[]).push(b)}else none.push(b)});
    var names=Object.keys(g).sort(function(a,b){return minYear(g[a])-minYear(g[b])||a.localeCompare(b)});
    function list(l){return '<ul class="list">'+l.map(function(b){return rowHTML(b,isRead(b))}).join("")+'</ul>'}
    if(!names.length)return list(books);
    var out=names.map(function(n){return '<div class="sub">'+esc(n)+'<span>'+g[n].length+(g[n].length===1?' book':' books')+'</span></div>'+list(g[n])}).join("");
    if(none.length)out+='<div class="sub">Not in a series<span>'+none.length+'</span></div>'+list(none);
    return out;
  }

  function renderResults(){
    var c=current, el=$("results");
    if(!c.books.length){el.innerHTML="";return}
    var n=c.books.filter(function(b){return lib[b.id]}).length;
    el.innerHTML='<div class="sumline"><span>'+c.books.length+' books by '+esc(c.author.name)+'</span>'+
      '<div class="acts"><span id="readn">'+n+' read</span><button class="btn quiet" type="button" data-act="org">'+(organizing?'Done':'Organize series')+'</button></div></div>'+
      groupedHTML(c.books,function(b){return !!lib[b.id]});
  }

  function updateBar(){
    $("sbar").hidden=!organizing; document.body.classList.toggle("org",organizing);
    $("selcount").textContent=Object.keys(sel).length+" selected";
    var names={}; current.books.forEach(function(b){if(series[b.id])names[series[b.id]]=1});
    $("serieslist").innerHTML=Object.keys(names).map(function(n){return '<option value="'+esc(n)+'">'}).join("");
  }
  function toggleOrg(){organizing=!organizing; sel={}; $("smsg").textContent=""; renderResults(); updateBar()}
  function applySeries(name){
    var ids=Object.keys(sel);
    if(!ids.length){$("smsg").textContent="Tap books to select them first.";return}
    if(name!==null&&!name){$("smsg").textContent="Type a series name.";return}
    ids.forEach(function(id){if(name===null)delete series[id];else series[id]=name});
    saveSeries(); sel={}; $("sname").value=""; $("smsg").textContent=""; renderResults(); updateBar();
  }
  $("assign").onclick=function(){applySeries($("sname").value.trim())};
  $("unassign").onclick=function(){applySeries(null)};
  $("sdone").onclick=toggleOrg;

  function toggle(id,book){
    if(lib[id])delete lib[id];
    else if(book)lib[id]={id:id,title:book.title,year:book.year,author:book.author,authorKey:book.authorKey,added:Date.now()};
    save(); $("count").textContent=Object.keys(lib).length;
  }

  $("results").addEventListener("click",function(e){
    if(e.target.closest("[data-act]")){toggleOrg();return}
    var row=e.target.closest(".row"); if(!row)return;
    var id=row.dataset.id, book=current.books.filter(function(b){return b.id===id})[0];
    if(organizing){
      if(sel[id])delete sel[id]; else sel[id]=1;
      row.classList.toggle("sel",!!sel[id]); updateBar(); return;
    }
    toggle(id,book);
    row.setAttribute("aria-checked",!!lib[id]);
    var n=current.books.filter(function(b){return lib[b.id]}).length;
    $("readn").textContent=n+" read";
  });

  /* ---------- library ---------- */
  function renderLib(){
    var all=Object.keys(lib).map(function(k){return lib[k]});
    $("count").textContent=all.length;
    var el=$("library");
    if(!all.length){
      el.innerHTML='<div class="empty">No books checked off yet.<br>Search for an author on the Find books tab and tap the books you have read.</div>';
      return;
    }
    var groups={};
    all.forEach(function(b){var k=b.authorKey||b.author;(groups[k]=groups[k]||{name:b.author,books:[]}).books.push(b)});
    var order=Object.keys(groups).sort(function(a,b){
      return lastName(groups[a].name).localeCompare(lastName(groups[b].name))||groups[a].name.localeCompare(groups[b].name)});
    el.innerHTML=order.map(function(k){
      var g=groups[k];
      g.books.sort(function(x,y){return (x.year||9999)-(y.year||9999)||x.title.localeCompare(y.title)});
      return '<div class="group"><h2>'+esc(g.name)+'<span>'+g.books.length+(g.books.length===1?' book':' books')+'</span></h2>'+
        groupedHTML(g.books,function(){return true})+'</div>';
    }).join("");
  }

  $("library").addEventListener("click",function(e){
    var row=e.target.closest(".row"); if(!row)return;
    var b=lib[row.dataset.id]; if(!b)return;
    if(!confirm("Remove “"+b.title+"” from your library?"))return;
    toggle(b.id); renderLib();
  });

  /* keyboard support for rows */
  document.addEventListener("keydown",function(e){
    if((e.key===" "||e.key==="Enter")&&e.target.classList&&e.target.classList.contains("row")){e.preventDefault();e.target.click()}
  });

  /* ---------- backup ---------- */
  $("export").onclick=function(){
    var data=JSON.stringify({app:"books-read",version:2,exported:new Date().toISOString(),series:series,books:Object.keys(lib).map(function(k){return lib[k]})},null,2);
    var name="books-read-backup-"+new Date().toISOString().slice(0,10)+".json";
    var file; try{file=new File([data],name,{type:"application/json"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Books Read backup"}).then(function(){flash("Backup ready.")}).catch(function(err){
        if(err&&err.name!=="AbortError")download(data,name);
      });
    }else download(data,name);
  };
  function download(data,name){
    var url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000); flash("Backup downloaded.");
  }
  function mergeSeries(d){
    if(d&&d.series&&typeof d.series==="object"&&!Array.isArray(d.series)){
      var changed=false;
      Object.keys(d.series).forEach(function(k){if(typeof d.series[k]==="string"&&d.series[k]&&!series[k]){series[k]=d.series[k];changed=true}});
      if(changed)saveSeries();
    }
  }
  $("import").onclick=function(){$("file").click()};
  $("file").onchange=function(){
    var f=this.files[0]; if(!f)return;
    var input=this, r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result), list=Array.isArray(d)?d:d.books, added=0;
        if(!Array.isArray(list))throw new Error("bad format");
        list.forEach(function(b){
          if(b&&b.id&&b.title&&b.author&&!lib[b.id]){
            lib[b.id]={id:String(b.id),title:String(b.title),year:b.year||null,author:String(b.author),authorKey:b.authorKey||b.author,added:b.added||Date.now()};added++;
          }
        });
        mergeSeries(d); save(); renderLib(); flash("Imported "+added+" new "+(added===1?"book":"books")+".");
      }catch(e){flash("That file is not a valid backup.",true)}
      input.value="";
    };
    r.readAsText(f);
  };

  /* ---------- home screen icon (drawn at load) ---------- */
  try{
    var c=document.createElement("canvas"); c.width=c.height=180; var x=c.getContext("2d");
    x.fillStyle="#8c2f39"; x.fillRect(0,0,180,180);
    x.fillStyle="#fff"; x.fillRect(48,40,84,100); x.fillStyle="#8c2f39"; x.fillRect(58,40,6,100);
    x.strokeStyle="#8c2f39"; x.lineWidth=7; x.lineCap="round"; x.lineJoin="round";
    x.beginPath(); x.moveTo(80,92); x.lineTo(95,107); x.lineTo(120,72); x.stroke();
    $("icon").href=c.toDataURL("image/png");
  }catch(e){}

  $("count").textContent=Object.keys(lib).length;
})();
</script>
</body>
</html>
